<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Remédiation et Législation — Bibliothèque</title>
  <link rel="stylesheet" href="assets/app.css" />
  <link rel="icon" href="assets/images/logo-livecampus.png" />
</head>
<body>
  <div class="app">
    <aside class="sidebar" id="sidebar">
      <div class="brand">
        <img src="assets/images/logo-livecampus.png" alt="Livecampus" />
        <div>
          <p class="brand__school">Livecampus</p>
          <p class="brand__title">Remédiation et Législation</p>
        </div>
      </div>

      <label class="visually-hidden" for="search">Rechercher</label>
      <input class="search" id="search" type="search" placeholder="Rechercher un cours, quiz, mini-cas…" />

      <nav id="nav" aria-label="Documents"></nav>
      <p class="sidebar__meta" id="sidebar-meta">Chargement…</p>
    </aside>

    <main class="main" id="main-panel">
      <div class="toolbar">
        <button type="button" class="menu-toggle" id="menu-toggle" aria-label="Menu">Menu</button>
        <h1 class="toolbar__title" id="doc-title">Bibliothèque</h1>
        <div class="toolbar__actions">
          <a class="btn" id="open-tab" href="#" target="_blank" rel="noopener" hidden>Ouvrir la page</a>
        </div>
      </div>

      <div class="viewer-wrap">
        <div class="welcome" id="welcome">
          <h1>Bibliothèque du cours</h1>
          <p>Choisissez un chapitre, un quiz ou un mini-cas dans le menu. Les pages affichées reprennent le même style que les PDF générés.</p>
        </div>
        <iframe class="viewer" id="viewer" title="Document" hidden></iframe>
      </div>
    </main>
  </div>

  <style>
    .visually-hidden {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      white-space: nowrap;
      border: 0;
    }
  </style>
  <script src="assets/app.js"></script>
</body>
</html>
